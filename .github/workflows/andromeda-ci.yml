name: Andromeda CI

# Desktop client (andromeda/) verify + wire-drift, in the monorepo.
# - verify runs on andromeda changes; wire-drift also runs on gateway-go changes
#   (a gateway contract change must re-check the committed TS wire types).
# - wire-drift needs no Deneb clone / DENEB_DIR: gen-wire auto-detects ../gateway-go
#   from andromeda/ (scripts/gen-wire.mjs). paths is workflow-level, so verify also
#   fires on gateway-only changes; split into two workflows if that waste matters.

on:
  push:
    branches: [main]
    paths: ["andromeda/**", "gateway-go/**"]
  pull_request:
    paths: ["andromeda/**", "gateway-go/**"]

# Cancel superseded runs (rapid pushes to a PR) — every other CI workflow
# (ci.yml, sbom.yml, docs.yml, generate-check.yml) already does this; andromeda
# was the lone gap, so its verify+wire-drift piled up in parallel.
concurrency:
  group: andromeda-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: andromeda

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: andromeda/package.json

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: andromeda/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run test
      - name: Mock gateway integration contract
        run: pnpm run test:integration
      - run: pnpm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            wget

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: andromeda/src-tauri -> target

      - name: Check Rust crate
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust crate
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust crate
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  wire-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: gateway-go/go.sum

      # gen-wire는 node 빌트인만 사용 → pnpm install 불필요. ../gateway-go 자동 감지.
      - name: Verify wire types are up to date
        run: node scripts/gen-wire.mjs --check
