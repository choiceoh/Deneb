name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  python:
    name: Python support tooling
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install hash-locked Python dependencies
        run: >-
          python -m pip install --require-hashes
          -r requirements.lock
          -r requirements-dev.lock

      - name: Static analysis for Python support tooling
        run: make python-lint

      - name: Ensure base commit for path filter
        uses: ./.github/actions/ensure-base-commit
        with:
          base-sha: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          fetch-ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.base.ref }}

      - name: Detect scripts/ops changes
        id: scripts
        env:
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "${BASE_SHA}" HEAD -- \
              'scripts/**' 'Makefile' 'requirements*.lock' '.github/workflows/ci.yml' \
              | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Skipping python-test: no scripts/ops paths changed."
          fi

      - name: Test Python support tooling
        if: steps.scripts.outputs.changed == 'true'
        run: make python-test

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes shellcheck

      - name: Static analysis for operational shell
        run: make shell-lint

      - name: Test operational shell contracts
        run: make shell-behavior-test

  # Detect docs-only changes to skip heavy jobs.
  docs-scope:
    runs-on: ubuntu-24.04-arm
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
      docs_changed: ${{ steps.check.outputs.docs_changed }}
      skills_changed: ${{ steps.check.outputs.skills_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          fetch-tags: false
          submodules: false

      - name: Ensure docs-scope base commit
        uses: ./.github/actions/ensure-base-commit
        with:
          base-sha: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          fetch-ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.base.ref }}

      - name: Detect docs-only changes
        id: check
        uses: ./.github/actions/detect-docs-changes

  # SKILL.md is executable prompt policy despite its Markdown extension. Run
  # the real trigger corpus even when the heavy Go job is skipped as docs-only.
  skill-evals:
    needs: [docs-scope]
    if: needs.docs-scope.outputs.skills_changed == 'true'
    name: Skill evals
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: gateway-go/go.sum

      - name: Test skill trigger and ablation contracts
        run: make skill-eval-test

  # ── Go gateway (parallel lanes) ─────────────────────────────────
  # Wall time was ~6m with build→lint→unit+cover→integration tags in one
  # job. Split into three concurrent jobs; a thin "Go" aggregator keeps the
  # historical required-check name. Coverprofile lives on Nightly Drift
  # (atomic covermode slowed every PR without gating on the number).

  go-static:
    needs: [docs-scope]
    if: needs.docs-scope.outputs.docs_only != 'true'
    name: Go (static)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gateway-go
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          # golangci-lint runs in diff mode against the PR/push base SHA; a
          # shallow clone lacks that history and falls back to linting the whole
          # tree. Full history keeps the diff scoped to this change.
          fetch-depth: 0

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: gateway-go/go.sum

      - name: Build
        run: CGO_ENABLED=0 go build ./...

      - name: Vet
        run: go vet ./...

      # Full-tree gofmt/gofumpt lives on Nightly Drift. PR CI only formats
      # files touched vs the PR/push base so unrelated drift does not tax every Go PR.
      - name: Check formatting (changed Go files)
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable base SHA; skipping scoped gofmt (nightly covers full tree)."
            exit 0
          fi
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "${BASE_SHA}" HEAD -- 'gateway-go/**/*.go' \
              | sed 's|^gateway-go/||' || true
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Go files."
            exit 0
          fi
          cd gateway-go
          bad=$(gofmt -l "${files[@]}" || true)
          if [ -n "$bad" ]; then
            echo "Go files need formatting:"
            echo "$bad"
            exit 1
          fi
          echo "Changed Go files are gofmt-clean."

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.5
          working-directory: gateway-go
          # Prefer PR base / push before SHA over HEAD~1 (merge commits make HEAD~1 wrong).
          args: --new-from-rev=${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}

      - name: Build gateway binary
        run: CGO_ENABLED=0 go build -o gateway ./cmd/gateway/

      - name: Gateway binary smoke test
        run: |
          ./gateway --port 0 &
          GW_PID=$!
          sleep 1
          kill -0 $GW_PID 2>/dev/null || { echo "Gateway failed to start"; exit 1; }
          kill $GW_PID
          wait $GW_PID 2>/dev/null || true
          echo "Gateway smoke test passed"

      - name: Upload gateway binary
        uses: actions/upload-artifact@v4
        with:
          name: deneb-gateway
          path: gateway-go/gateway
          retention-days: 1

  # Package-sharded unit tests: GHA ARM runners are ~2–4 cores, so one
  # `go test ./...` wall is dominated by sequential compile of heavy packages.
  # Four shards cut the unit wall roughly with the number of runners.
  go-unit-shard:
    needs: [docs-scope]
    if: needs.docs-scope.outputs.docs_only != 'true'
    name: Go (unit ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: gateway-go
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: gateway-go/go.sum

      # No coverprofile here — atomic coverage was ~2× unit wall with no PR gate.
      # Nightly Drift emits the coverage artifact.
      - name: Test shard
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: "4"
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(go list ./...)
          selected=()
          for i in "${!pkgs[@]}"; do
            if (( i % SHARDS == SHARD )); then
              selected+=("${pkgs[i]}")
            fi
          done
          echo "shard ${SHARD}/${SHARDS}: ${#selected[@]} packages"
          if [ "${#selected[@]}" -eq 0 ]; then
            echo "empty shard — nothing to test"
            exit 0
          fi
          CGO_ENABLED=0 go test -count=1 "${selected[@]}"

  # Aggregate check name "Go (unit)" + race/runtime-health (small; keep off the
  # sharded critical path's compile fan-out).
  # No defaults.working-directory here: the require step runs before checkout,
  # and gateway-go/ does not exist yet on a fresh runner.
  go-unit:
    name: Go (unit)
    needs: [go-unit-shard]
    if: always() && needs.go-unit-shard.result != 'skipped'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Require unit shards
        run: test "${{ needs.go-unit-shard.result }}" = "success"

      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: gateway-go/go.sum

      - name: Test runtime-health audit
        run: make runtime-health-test

      - name: Test cache-cost audit
        run: make cache-cost-audit-test

      # Doc-reference validate-or-freeze (arXiv:2607.13285): agent docs must not
      # point at moved/deleted source. Mirrors the local `make ci` audit lane —
      # without this step the gate is local-only and red-merge paths bypass it.
      - name: Doc reference lint
        run: make doc-ref-lint

      - name: Race test (concurrency core)
        working-directory: gateway-go
        run: >-
          CGO_ENABLED=1 go test -race -count=1
          ./internal/core/corecache
          ./internal/ai/provider
          ./internal/pipeline/chat/streaming
          ./internal/runtime/events

  go-integration:
    needs: [docs-scope]
    if: needs.docs-scope.outputs.docs_only != 'true'
    name: Go (integration tags)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gateway-go
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: gateway-go/go.sum

      - name: Test (integration tags)
        run: CGO_ENABLED=0 go test -count=1 -tags=integration ./...

  # Aggregate so rulesets / land scripts that expect check name "Go" still work.
  go:
    name: Go
    needs: [go-static, go-unit, go-integration]
    if: always() && needs.go-static.result != 'skipped'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - name: Require parallel Go lanes
        run: |
          set -euo pipefail
          test "${{ needs.go-static.result }}" = "success"
          test "${{ needs.go-unit.result }}" = "success"
          test "${{ needs.go-integration.result }}" = "success"

  # ── Integration (end-to-end gateway test) ────────────────────
  integration:
    needs: [go-static]
    name: Integration (gateway e2e)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: deneb-gateway
          path: dist/

      - name: Make gateway binary executable
        run: chmod +x dist/gateway

      - name: Gateway health + RPC endpoint test
        run: |
          # The gateway's only HTTP RPC surface is the native client's
          # /api/v1/miniapp/rpc (client-token gated, miniapp.* namespace);
          # the generic /api/v1/rpc route was retired with the plugin host.
          # Seed a client token so the e2e exercises real auth + dispatch.
          export DENEB_STATE_DIR="$RUNNER_TEMP/deneb-e2e-state"
          mkdir -p "$DENEB_STATE_DIR"
          printf 'ci-e2e-client-token\n' > "$DENEB_STATE_DIR/client_token"
          dist/gateway --port 19999 --bind loopback &
          GW_PID=$!
          sleep 2
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:19999/health || echo "000")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Health check failed with status $HTTP_STATUS"
            kill $GW_PID 2>/dev/null || true
            exit 1
          fi
          echo "Health endpoint returned 200"
          RESULT=$(curl -s -X POST http://127.0.0.1:19999/api/v1/miniapp/rpc \
            -H "Content-Type: application/json" \
            -H "X-Deneb-Client-Token: ci-e2e-client-token" \
            -d '{"type":"req","id":"test-1","method":"miniapp.ping","params":{}}')
          echo "RPC response: $RESULT"
          echo "$RESULT" | grep -q '"ok":true' || { echo "RPC miniapp.ping failed"; kill $GW_PID; exit 1; }
          kill $GW_PID
          wait $GW_PID 2>/dev/null || true
          echo "Integration test passed"

  # ── Secrets: private key detection + workflow audit ───────────
  secrets:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Ensure secrets base commit
        uses: ./.github/actions/ensure-base-commit
        with:
          base-sha: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          fetch-ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.base.ref }}

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            .pre-commit-config.yaml
            .github/workflows/ci.yml

      - name: Restore pre-commit cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit

      - name: Detect committed private keys
        run: pre-commit run --all-files detect-private-key

      - name: Audit changed GitHub workflows with zizmor
        env:
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable base SHA detected; skipping zizmor."
            exit 0
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "Base SHA ${BASE_SHA} is unavailable; skipping zizmor."
            exit 0
          fi
          mapfile -t workflow_files < <(
            git diff --name-only "${BASE_SHA}" HEAD -- '.github/workflows/*.yml' '.github/workflows/*.yaml'
          )
          if [ "${#workflow_files[@]}" -eq 0 ]; then
            echo "No workflow changes detected; skipping zizmor."
            exit 0
          fi
          printf 'Auditing workflow files:\n%s\n' "${workflow_files[@]}"
          pre-commit run zizmor --files "${workflow_files[@]}"
