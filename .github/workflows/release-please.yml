name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_version:
        description: "Target version (e.g. 3.12.0). Leave empty for auto."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  attestations: write

jobs:
  release-please:
    runs-on: ubuntu-24.04-arm
    outputs:
      # 멀티패키지(manifest)에선 출력이 패키지 경로로 prefix됨(`.--*`, `andromeda--*`).
      # 게이트웨이(`.`)는 prefix 우선 + 단일 시절 bare 출력 폴백 — release-please는 패키지별
      # release_created를 'true'/'false'로 명시 출력하므로 andromeda-only 릴리즈엔 오발화 안 함.
      release-created: ${{ steps.release.outputs['.--release_created'] || steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs['.--tag_name'] || steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs['.--version'] || steps.release.outputs.version }}
      andromeda-release-created: ${{ steps.release.outputs['andromeda--release_created'] }}
      andromeda-tag: ${{ steps.release.outputs['andromeda--tag_name'] }}
      andromeda-release-id: ${{ steps.release.outputs['andromeda--id'] }}
      # 릴리즈 PR 브랜치(생성/갱신 시) — cargo-lock 재생성 잡이 소비.
      prs-created: ${{ steps.release.outputs.prs_created }}
      release-pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      # 첫 릴리즈에서 실제 출력키를 로그로 확인(멀티패키지 prefix 검증). env 경유 = injection 안전.
      - name: Debug release-please outputs
        if: always()
        env:
          OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: echo "$OUTPUTS"

  release-pr-cargo-lock:
    # release-please는 extra-files로 andromeda/src-tauri/Cargo.toml 버전만 올리고
    # Cargo.lock을 재생성하지 못한다 → 릴리즈 커밋이 머지될 때마다 main의
    # `cargo check --locked`(rust 체크)가 깨졌다 (0.0.70 #3552, 0.0.71 #3557 재발).
    # 릴리즈 PR 브랜치 위에서 lock을 재생성해 커밋하므로 파손이 main에 못 닿는다.
    # release-please가 브랜치를 force-push로 갱신하면 이 커밋은 사라지지만, 다음
    # main push의 이 잡이 다시 붙인다(자가 치유).
    needs: release-please
    if: needs.release-please.outputs.prs-created == 'true' && needs.release-please.outputs.release-pr != ''
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.release-pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate andromeda Cargo.lock for the version bump
        run: cargo update --workspace --manifest-path andromeda/src-tauri/Cargo.toml
      - name: Commit lock to the release PR branch (if changed)
        run: |
          set -euo pipefail
          if git diff --quiet -- andromeda/src-tauri/Cargo.lock; then
            echo "Cargo.lock already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add andromeda/src-tauri/Cargo.lock
          git commit -m "chore(andromeda): regenerate Cargo.lock for release version bump"
          git push

  post-release:
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          # Build the gateway from the released tag (same reason as andromeda-build):
          # release creation can land in a neighboring run, and building github.sha
          # would compile a stale tree under the new version label. fetch-depth: 0
          # preserves full history for the version/changelog tooling.
          ref: ${{ needs.release-please.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: gateway-go/go.sum
      - name: Detect pre-release
        id: prerelease
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          if echo "$VERSION" | grep -qE '(alpha|beta|rc|pre)'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build gateway binary (linux-arm64)
        run: |
          cd gateway-go
          CGO_ENABLED=0 go build \
            -ldflags "-s -w -X main.version=${{ needs.release-please.outputs.version }}" \
            -o ../deneb-linux-arm64 ./cmd/gateway/
      - name: Generate SHA256 checksum
        run: sha256sum deneb-linux-arm64 > deneb-linux-arm64.sha256
      - name: Upload release assets
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ needs.release-please.outputs.tag }}
          files: |
            deneb-linux-arm64
            deneb-linux-arm64.sha256
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-summary:
    needs: [release-please, post-release]
    if: needs.release-please.outputs.release-created == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Collect commit stats
        id: stats
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            COMMIT_RANGE="HEAD~100..HEAD"
          else
            COMMIT_RANGE="${PREV_TAG}..HEAD"
          fi
          TOTAL=$(git log --oneline $COMMIT_RANGE | wc -l)
          ADDED=$(git diff --shortstat $PREV_TAG..HEAD 2>/dev/null | grep -oP '\d+(?= insertion)' || echo 0)
          DELETED=$(git diff --shortstat $PREV_TAG..HEAD 2>/dev/null | grep -oP '\d+(?= deletion)' || echo 0)
          FILES=$(git diff --stat $PREV_TAG..HEAD 2>/dev/null | tail -1 | grep -oP '\d+(?= file)' || echo 0)
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "added=$ADDED" >> "$GITHUB_OUTPUT"
          echo "deleted=$DELETED" >> "$GITHUB_OUTPUT"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
      - name: Generate release summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## 🚀 Deneb ${{ needs.release-please.outputs.tag }}

          | Metric | Value |
          |--------|-------|
          | Commits | ${{ steps.stats.outputs.total }} |
          | Files changed | ${{ steps.stats.outputs.files }} |
          | Lines added | ${{ steps.stats.outputs.added }} |
          | Lines deleted | ${{ steps.stats.outputs.deleted }} |

          ### Binary
          | Platform | File |
          |----------|------|
          | linux/arm64 | \`deneb-linux-arm64\` |

          ### Deploy on DGX Spark
          \`\`\`bash
          curl -sL -o deneb https://github.com/choiceoh/Deneb/releases/download/${{ needs.release-please.outputs.tag }}/deneb-linux-arm64
          chmod +x deneb && sudo mv deneb /usr/local/bin/
          deneb gateway restart
          \`\`\`
          EOF

  andromeda-build:
    # andromeda 컴포넌트 릴리즈가 생성될 때만 — 데스크탑 번들을 빌드·서명해 그 릴리즈에 업로드.
    # ⚠️ 시크릿 TAURI_SIGNING_PRIVATE_KEY[_PASSWORD] 필요 (andromeda와 동일 minisign 키).
    needs: release-please
    if: needs.release-please.outputs.andromeda-release-created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: "--target aarch64-apple-darwin"
            rust_target: aarch64-apple-darwin
          - platform: macos-latest # Intel
            args: "--target x86_64-apple-darwin"
            rust_target: x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust_target: ""
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: andromeda
    steps:
      - uses: actions/checkout@v7
        with:
          # Build from the released tag, not github.sha (the commit that triggered
          # this run). release-please can create the release in a NEIGHBORING push's
          # run (interleaved merges / its one-push lag), so github.sha may still be
          # the pre-bump tree — that bakes the old version into the bundle (e.g.
          # 0.0.29 files were uploaded to the andromeda-v0.0.30 release). The tag
          # always carries the bumped version, keeping bundle version == release.
          ref: ${{ needs.release-please.outputs.andromeda-tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: andromeda/package.json

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: andromeda/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: andromeda/src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, sign, and upload bundles
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: andromeda
          releaseId: ${{ needs.release-please.outputs.andromeda-release-id }}
          args: ${{ matrix.args }}

  andromeda-update-manifest:
    # Point the Tauri auto-updater at a STABLE url. The updater endpoint can't be
    # /releases/latest — that's repo-wide (the gateway's release, which carries no
    # andromeda latest.json), so a 0.0.x desktop build never sees a newer andromeda
    # manifest and reports "up to date". Fix: mirror the just-built manifest onto a
    # fixed, non-"Latest" rolling release tagged `andromeda-latest`, and the app
    # polls https://github.com/choiceoh/Deneb/releases/download/andromeda-latest/latest.json.
    # Runs once, after every platform bundle + the merged latest.json are on the tag.
    needs: [release-please, andromeda-build]
    if: needs.release-please.outputs.andromeda-release-created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Mirror latest.json to the rolling andromeda-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.andromeda-tag }}
        run: |
          set -euo pipefail
          # The version tag's latest.json has all platforms merged by tauri-action.
          gh release download "$TAG" --repo "$REPO" --pattern latest.json --dir . --clobber
          # Create the fixed rolling release once — prerelease + --latest=false so it
          # never steals the repo "Latest" marker from the gateway — then overwrite it.
          if ! gh release view andromeda-latest --repo "$REPO" >/dev/null 2>&1; then
            gh release create andromeda-latest --repo "$REPO" \
              --title "Andromeda updater manifest (rolling)" \
              --notes "Always holds the newest andromeda latest.json for the Tauri auto-updater. Managed by release-please.yml — do not delete." \
              --prerelease --latest=false
          fi
          gh release upload andromeda-latest latest.json --repo "$REPO" --clobber
