# nightly-drift.yml — full-tree gate sweep of main, on a schedule.
#
# Why this exists: the per-PR workflows are path-gated (kotlin-lint is even
# pull_request-only, and the Go lane lints in diff mode), so a gate violation
# can land on main and lie dormant until an unrelated PR touches that lane and
# inherits the red check. One session hit four of these in a row
# (gofumpt on gateway-go, markdownlint, the tauri feature allowlist, Kotlin
# import ordering). This workflow runs every lane's local gate over the whole
# tree nightly and opens/updates a tracking issue on failure, so drift is
# surfaced on main directly instead of taxing the next PR author.
name: Nightly Drift Watch

on:
  schedule:
    - cron: "0 18 * * *" # 03:00 KST, before the workday
  workflow_dispatch:

concurrency:
  group: nightly-drift
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-gate:
    # Mirrors the local `make check` surfaces the PR lane misses: gofumpt over
    # the full tree (ci.yml checks plain gofmt + diff-mode golangci only).
    # Coverage artifact also lives here — PR CI dropped atomic covermode to cut
    # unit wall (~2×) with no PR coverage floor.
    name: go (gofumpt + vet + test + coverage)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: gateway-go/go.sum

      - name: gofumpt (full tree)
        run: make go-fmt

      - name: Vet
        working-directory: gateway-go
        run: go vet ./...

      - name: Test with coverage
        working-directory: gateway-go
        run: CGO_ENABLED=0 go test -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Report coverage total
        working-directory: gateway-go
        run: |
          TOTAL=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $NF}' | tr -d '%')
          echo "Total coverage: ${TOTAL}%"
          echo "coverage_total=${TOTAL}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: gateway-go/coverage.out
          retention-days: 14

  kotlin:
    # Same gate as kotlin-lint.yml, which triggers on pull_request only —
    # direct pushes to main skip it entirely. Nightly closes that hole.
    # Self-hosted srv4 keeps ~/.gradle + ~/android-sdk warm (matches PR lane).
    name: kotlin (spotless + detekt + desktopTest + android compile)
    runs-on: [self-hosted, srv4]
    timeout-minutes: 25
    env:
      ANDROID_HOME: /home/choiceoh/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk-arm64
    defaults:
      run:
        working-directory: client-android/app
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: spotless + detekt + desktopTest + android compile
        # desktopTest already includes Gateway*/DenebUiBlockIntegrationTest —
        # no separate integrationTest re-run (that was pure wall waste).
        run: >
          ./gradlew
          spotlessCheck
          detekt
          desktopTest
          :composeApp:compileAndroidMain
          :androidApp:compileFossReleaseKotlin

  andromeda:
    name: andromeda (pnpm verify)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: andromeda
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: andromeda/package.json

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: andromeda/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run test
      - run: pnpm run build

  rust:
    name: rust (tauri cargo check + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: andromeda
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            wget

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: andromeda/src-tauri -> target

      - name: Check Rust crate
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust crate
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust crate
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  recall-health:
    # Advisory recall-quality sweep against the LIVE wiki + repair worklist
    # (bench misses classified into thin-folder / sibling-overlap / vocab-gap).
    # srv4 only: needs the Nemotron embedding sidecar (:8002) and the prod wiki.
    # Deliberately NOT in the notify gate — trends are read from the step
    # summary (the health-v2 precedent: recall ratchets stay out of paging).
    name: recall-health (advisory)
    runs-on: [self-hosted, srv4]
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: recall health + repair worklist
        env:
          DENEB_EMBEDDING_URL: http://127.0.0.1:8002
          DENEB_WIKI_SEM_FLOOR: "0.44"
          DENEB_WIKI_RRF_SEM_WEIGHT: "10"
          DENEB_WIKI_RRF_GRAPH_WEIGHT: "3"
          RECALL_WORKLIST: "1"
        run: scripts/dev/recall-health.sh | tee -a "$GITHUB_STEP_SUMMARY"

  docs:
    # markdownlint + spellcheck only — the link check hits external URLs and
    # would page on other people's outages, so it stays out of the nightly.
    name: docs (markdownlint + spellcheck)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install codespell
        run: pip install --quiet codespell

      - name: Markdown lint
        run: make docs-lint

      - name: Spellcheck
        run: bash scripts/docs-spellcheck.sh

  report:
    # One open tracking issue, updated per failing night — not one issue per
    # night. Quiet when green.
    name: report drift
    needs: [go-gate, kotlin, andromeda, rust, docs]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the drift issue
        run: |
          gh label create nightly-drift \
            --description "Nightly full-tree gate sweep failures on main" \
            --color D93F0B --force
          body="Nightly Drift Watch가 main에서 게이트 실패를 감지했습니다: ${RUN_URL}

          실패한 레인의 로그를 보고 main에서 직접 해소해 주세요 — 방치하면 해당 레인을 건드리는 다음 PR이 이 실패를 물려받습니다."
          existing=$(gh issue list --label nightly-drift --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create \
              --title "nightly drift: main 게이트 실패" \
              --label nightly-drift \
              --body "$body"
          fi
