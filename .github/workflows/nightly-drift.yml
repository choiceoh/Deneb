# nightly-drift.yml — full-tree gate sweep of main, on a schedule.
#
# Why this exists: the per-PR workflows are path-gated (kotlin-lint is even
# pull_request-only, and the Go lane lints in diff mode), so a gate violation
# can land on main and lie dormant until an unrelated PR touches that lane and
# inherits the red check. One session hit four of these in a row
# (gofumpt on gateway-go, markdownlint, the tauri feature allowlist, Kotlin
# import ordering). This workflow runs every lane's local gate over the whole
# tree nightly and opens/updates a tracking issue on failure, so drift is
# surfaced on main directly instead of taxing the next PR author.
name: Nightly Drift Watch

on:
  schedule:
    - cron: "0 18 * * *" # 03:00 KST, before the workday
  workflow_dispatch:

concurrency:
  group: nightly-drift
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-gate:
    # Mirrors the local `make check` surfaces the PR lane misses: gofumpt over
    # the full tree (ci.yml checks plain gofmt + diff-mode golangci only).
    # Coverage artifact also lives here — PR CI dropped atomic covermode to cut
    # unit wall (~2×) with no PR coverage floor.
    name: go (gofumpt + vet + test + coverage)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: gateway-go/go.sum

      - name: gofumpt (full tree)
        run: make go-fmt

      - name: Vet
        working-directory: gateway-go
        run: go vet ./...

      - name: Test with coverage
        working-directory: gateway-go
        run: CGO_ENABLED=0 go test -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Report coverage total
        working-directory: gateway-go
        run: |
          TOTAL=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $NF}' | tr -d '%')
          echo "Total coverage: ${TOTAL}%"
          echo "coverage_total=${TOTAL}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: gateway-go/coverage.out
          retention-days: 14

  kotlin:
    # Same gate as kotlin-lint.yml, which triggers on pull_request only —
    # direct pushes to main skip it entirely. Nightly closes that hole.
    # Self-hosted srv4 keeps ~/.gradle + ~/android-sdk warm (matches PR lane).
    name: kotlin (spotless + detekt + desktopTest + android compile)
    runs-on: [self-hosted, srv4]
    timeout-minutes: 25
    env:
      ANDROID_HOME: /home/choiceoh/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk-arm64
    defaults:
      run:
        working-directory: client-android/app
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: spotless + detekt + desktopTest + android compile
        # desktopTest already includes Gateway*/DenebUiBlockIntegrationTest —
        # no separate integrationTest re-run (that was pure wall waste).
        run: >
          ./gradlew
          spotlessCheck
          detekt
          desktopTest
          :composeApp:compileAndroidMain
          :androidApp:compileFossReleaseKotlin

  andromeda:
    name: andromeda (pnpm verify)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: andromeda
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: andromeda/package.json

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: andromeda/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run test
      - run: pnpm run build

  even-g2:
    # The glasses Glance plugin had no gate at all: `npm run build` was a local
    # convenience and nothing in CI ever ran it, so a type error or a broken
    # refresh-policy change would only surface on the wearer's HUD. Cheap lane —
    # the app is ~800 lines with no native toolchain.
    name: even-g2 (typecheck + test + build + simulator smoke)
    runs-on: ubuntu-latest
    # The smoke drives the REAL 45s poll interval and its 90s/180s backoff
    # steps, so it takes ~14 minutes by construction. Shrinking those for the
    # test would mean testing something other than what ships.
    timeout-minutes: 35
    defaults:
      run:
        working-directory: even-g2
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The simulator renders through WebKitGTK and has no linux-arm64 build,
      # so this lane is the ONLY place it can run: the gateway host is ARM and
      # skips the harness. ubuntu-latest is x86_64.
      - name: Install simulator runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-0 \
            xvfb

      - name: Simulator smoke (headless automation API)
        run: xvfb-run -a npm run smoke

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: even-g2-smoke
          path: even-g2/smoke-artifacts
          if-no-files-found: ignore
          retention-days: 7

  rust:
    name: rust (tauri cargo check + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: andromeda
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            wget

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: andromeda/src-tauri -> target

      - name: Check Rust crate
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust crate
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust crate
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  recall-health:
    # Advisory recall-quality sweep against the LIVE wiki + repair worklist
    # (bench misses classified into thin-folder / sibling-overlap / vocab-gap).
    # srv4 only: needs the Nemotron embedding sidecar (:8002) and the prod wiki.
    # Deliberately NOT in the notify gate — trends are read from the step
    # summary (the health-v2 precedent: recall ratchets stay out of paging).
    name: recall-health (advisory)
    runs-on: [self-hosted, srv4]
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      # Retrieval env (fusion weights, rerank, embedder) is NOT set here: the
      # script carries the production-parity defaults so this file cannot drift
      # from the gateway again (it held the retired 1:10:3 with no reranker,
      # scoring a configuration production abandoned on 2026-07-20).
      - name: recall health + repair worklist
        env:
          RECALL_WORKLIST: "1"
        run: scripts/dev/recall-health.sh | tee -a "$GITHUB_STEP_SUMMARY"

      # Weekly (Monday runs): grow the traffic gold set from the recall-utility
      # ledger. inject×cite joins are use-confirmed real-query gold at zero
      # annotation cost — the compounding source the hand-written sets lack;
      # the miner was built for weekly reruns but had no runner at all (found
      # unwired 2026-08-08, yielding 4 cases/day of real traffic). Dedupes by
      # normalized query, so append-only reruns are idempotent. Advisory like
      # the rest of this job; the output lives outside the repo (~/.deneb).
      - name: mine traffic gold (weekly)
        if: always()
        run: |
          if [ "$(date +%u)" = "1" ]; then
            python3 scripts/audit/mine_traffic_gold.py | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "traffic gold mining runs Mondays; skipped" >> "$GITHUB_STEP_SUMMARY"
          fi

  health-v3:
    # Health Bench 3.0 ratchet (Structure + Runtime; Fitness advisory).
    #
    # Why this exists: the ratchet had NO automatic runner at all. health-v2 was
    # pulled from PR CI (#4198) and v3 was never wired anywhere, so between
    # 2026-07-15 and 2026-07-25 the Runtime domain fell 58.3 → 16.2 (every
    # pillar past its hard bar: 0.69 err/run, p95 300s, 7.9% turn timeouts)
    # with zero automatic signal. The daily bench-refresh timer on srv4 writes
    # snapshots but never evaluates the ratchet.
    #
    # It does NOT gate: the health-v2 wedge (8 straight red nights, #3775) is
    # why ratchets stay off the paging path. Instead a regression opens/updates
    # one tracking issue — durable and visible without turning the nightly red.
    #
    # srv4 only: Runtime evidence is the live deneb-gateway journal.
    name: health-v3 ratchet (advisory)
    runs-on: [self-hosted, srv4]
    timeout-minutes: 30
    continue-on-error: true
    outputs:
      regressed: ${{ steps.ratchet.outputs.regressed }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          # Structure pillars (change-blast, co-change, delivery-proof) read
          # real git history. A shallow clone reports "required evidence
          # unavailable: git-change-history" and fail-closes the whole domain.
          fetch-depth: 0

      - name: health-v3 ratchet vs baseline
        id: ratchet
        run: |
          # The checked-in runtime cache is a 72h-TTL artifact and is normally
          # stale by the time anyone runs this (235h old on 2026-07-25), which
          # fail-closes Runtime to 0. Always re-read the live journal instead.
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          set +e
          python3 scripts/audit/health-bench-v3.py --refresh-runtime-cache --check \
            > /tmp/health-v3-nightly.txt 2>&1
          status=$?
          set -e
          {
            echo "## Health Bench 3.0 ratchet (advisory)"
            echo
            echo '```'
            cat /tmp/health-v3-nightly.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/health-v3-nightly.txt
          if [ "$status" -ne 0 ]; then
            echo "regressed=1" >> "$GITHUB_OUTPUT"
          fi
          # Advisory: the job never fails, so it stays out of the drift gate.
          exit 0

  report-health:
    # Separate tracking issue from nightly-drift: gate drift is "a lane broke",
    # this is "production/codebase health regressed against its baseline". They
    # have different owners and different fixes, so conflating them buries one.
    name: report health regression
    needs: [health-v3]
    if: needs.health-v3.outputs.regressed == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the health-bench issue
        run: |
          gh label create health-bench \
            --description "Health Bench 3.0 ratchet regressions on main" \
            --color 1D76DB --force
          body="Health Bench 3.0 래칫이 baseline 대비 회귀했습니다: ${RUN_URL}

          해당 실행의 스텝 요약에 회귀한 도메인·필러·finding 목록이 있습니다. Runtime 도메인은 롤링 저널 창을 읽으므로, 코드가 아니라 **프로덕션 동작**이 나빠졌다는 뜻일 수 있습니다 — 재현은 \`python3 scripts/audit/health-bench-v3.py --refresh-runtime-cache\`.

          베이스라인을 낮춰 통과시키지 마세요 (일방향 래칫)."
          existing=$(gh issue list --label health-bench --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            # Refresh the body in place instead of appending a comment every
            # night. A regression that persists is the normal case here (health-v2
            # ran 8 straight red nights, #3775); an identical daily comment buries
            # the issue rather than informing anyone. The streak counter is the
            # part that actually carries new information.
            prev=$(gh issue view "$existing" --json body --jq .body)
            days=$(printf '%s' "$prev" | sed -n 's/^연속 회귀: \([0-9]\{1,\}\)일차.*/\1/p' | head -1)
            days=$(( ${days:-1} + 1 ))
            gh issue edit "$existing" --body "연속 회귀: ${days}일차

          $body"
          else
            gh issue create \
              --title "health bench: main 래칫 회귀" \
              --label health-bench \
              --body "연속 회귀: 1일차

          $body"
          fi

  docs:
    # markdownlint + spellcheck only — the link check hits external URLs and
    # would page on other people's outages, so it stays out of the nightly.
    name: docs (markdownlint + spellcheck)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install codespell
        run: pip install --quiet codespell

      - name: Markdown lint
        run: make docs-lint

      - name: Spellcheck
        run: bash scripts/docs-spellcheck.sh

  report:
    # One open tracking issue, updated per failing night — not one issue per
    # night. Quiet when green.
    name: report drift
    needs: [go-gate, kotlin, andromeda, rust, docs, even-g2]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the drift issue
        run: |
          gh label create nightly-drift \
            --description "Nightly full-tree gate sweep failures on main" \
            --color D93F0B --force
          body="Nightly Drift Watch가 main에서 게이트 실패를 감지했습니다: ${RUN_URL}

          실패한 레인의 로그를 보고 main에서 직접 해소해 주세요 — 방치하면 해당 레인을 건드리는 다음 PR이 이 실패를 물려받습니다."
          existing=$(gh issue list --label nightly-drift --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create \
              --title "nightly drift: main 게이트 실패" \
              --label nightly-drift \
              --body "$body"
          fi

  autofix:
    # Detection without repair is how #3775 sat red for eight straight nights
    # and #4219 for another: this workflow filed an issue and waited for a
    # human. But when the failing lane is a deterministic FORMATTER, the repair
    # is deterministic too — the loop can author it instead of describing it.
    #
    # Scope is deliberately narrow. Only the four formatter lanes are in `needs`
    # (rust runs check/clippy/test, nothing auto-fixable), only the lanes that
    # actually failed get their fixer run, and the result is a PR — never a push
    # to main. A non-formatting failure produces an empty diff and this job
    # exits quietly, costing one no-op run on those nights.
    #
    # srv4 because spotlessApply needs the warm Gradle + Android SDK the kotlin
    # lane already relies on.
    name: autofix formatter drift
    needs: [go-gate, kotlin, andromeda, docs]
    if: failure()
    runs-on: [self-hosted, srv4]
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      FIX_BRANCH: chore/nightly-format-autofix
      ANDROID_HOME: /home/choiceoh/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Apply the failing lanes' formatters
        run: |
          set -euo pipefail
          if [ "${{ needs.go-gate.result }}" = "failure" ]; then
            make fmt
          fi
          if [ "${{ needs.docs.result }}" = "failure" ]; then
            # Spellcheck failures are NOT auto-fixable (a codespell hit needs a
            # human to choose the right word), so --fix only settles markdownlint.
            make docs-lint-fix
          fi
          if [ "${{ needs.andromeda.result }}" = "failure" ]; then
            cd andromeda && pnpm install --frozen-lockfile && pnpm run format
          fi
          if [ "${{ needs.kotlin.result }}" = "failure" ]; then
            cd client-android/app && ./gradlew spotlessApply --console=plain
          fi

      - name: Open or update the autofix PR
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "no formatter drift — the failing lane was not a formatting problem"
            exit 0
          fi
          # A formatter rewrites tracked files in place. If anything was added,
          # deleted, renamed, or type-changed, whatever ran was not just
          # formatting, and this job must not author that change unreviewed.
          #
          # Asked of git directly rather than by pattern-matching `git status`
          # output: this is the safety guard, and the srv4 runner's `grep` is
          # ugrep, whose -q/-v pairing does not return what GNU grep would — a
          # guard written that way silently passes everything.
          untracked=$(git ls-files --others --exclude-standard)
          structural=$(git diff --name-only --diff-filter=ADRCT)
          if [ -n "$untracked" ] || [ -n "$structural" ]; then
            echo "::warning::autofix produced non-modification changes; refusing to open a PR"
            git status --porcelain
            exit 0
          fi
          files=$(git diff --name-only | sed 's/^/- `/; s/$/`/')
          git config user.name "deneb-nightly-autofix"
          git config user.email "noreply@github.com"
          git checkout -B "$FIX_BRANCH"
          # Fetch the remote-tracking ref first so --force-with-lease actually
          # has a lease to check; without it the push either refuses outright or
          # degrades to a blind force over whatever is there.
          git fetch origin "+refs/heads/${FIX_BRANCH}:refs/remotes/origin/${FIX_BRANCH}" || true
          git commit -am "fix(ci): 나이틀리 포맷 드리프트 자동 수리

          Nightly Drift Watch가 main에서 포맷 게이트 실패를 감지해 해당 레인의
          포맷터를 그대로 돌린 결과. 손으로 쓴 변경 없음.

          실행: ${RUN_URL}"
          git push --force-with-lease origin "$FIX_BRANCH"

          body="## Summary

          Nightly Drift Watch가 main에서 **포맷 게이트 실패**를 감지했습니다 ([실행](${RUN_URL})). 실패한 레인의 포맷터를 그대로 돌린 결과가 이 PR입니다 — 방치하면 해당 레인을 건드리는 다음 PR이 이 실패를 물려받습니다.

          ## Changes

          포맷터 출력뿐이고 손으로 쓴 변경은 없습니다. 파일 추가·삭제·이름변경이 섞이면 이 잡은 PR을 열지 않고 경고만 남깁니다(포맷터가 할 일이 아니므로).

          ${files}

          ## Verification

          해당 레인의 포맷터(\`make fmt\` / \`make docs-lint-fix\` / \`pnpm run format\` / \`spotlessApply\`)가 자기 출력을 낸 것이므로 같은 레인의 check는 정의상 통과합니다. 랜딩 후 나이틀리가 main 전 레인을 재검증합니다.

          > 체크가 비어 있으면 \`GITHUB_TOKEN\`으로 연 PR이라 \`pull_request\` 워크플로가 트리거되지 않은 것입니다. 브랜치에 빈 커밋을 얹으면 CI가 붙습니다."

          existing=$(gh pr list --head "$FIX_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr comment "$existing" --body "$body"
            pr_url=$(gh pr view "$existing" --json url --jq .url)
          else
            pr_url=$(gh pr create \
              --base main --head "$FIX_BRANCH" \
              --title "fix(ci): 나이틀리 포맷 드리프트 자동 수리" \
              --body "$body")
          fi

          # Close the loop for whoever reads the tracking issue: the repair
          # already exists, so the issue should point at it instead of at a log
          # to re-diagnose.
          issue=$(gh issue list --label nightly-drift --state open --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "포맷 드리프트 부분은 자동 수리 PR이 준비돼 있습니다: ${pr_url}"
          fi
