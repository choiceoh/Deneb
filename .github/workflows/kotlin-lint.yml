# kotlin-lint.yml — formatting + bug-lint gate for the native client.
#
# The gateway has had a lint gate (golangci) from the start; the Kotlin side
# had spotless configured but never enforced (118 files drifted before this
# gate landed) and no bug-focused analysis at all. This runs both on every
# client PR:
#   - spotlessCheck: ktlint formatting (config in client-android/app/build.gradle.kts)
#   - detekt: bug catchers only (config/detekt.yml; style rulesets are off,
#     accepted pre-existing findings live in config/detekt-baseline.xml —
#     baseline updates need operator approval per docs/agent-rules/testing.md)
#   - full desktopTest: every deterministic shared/common and desktop JVM test,
#     including generated wire compatibility contracts (covers the Gateway* /
#     DenebUiBlockIntegrationTest set — no separate integrationTest re-run)
#   - android compile: :composeApp:compileAndroidMain + :androidApp:compileFossReleaseKotlin.
#     compileKotlinDesktop only type-checks the desktop source set, so commonMain
#     code that resolves only on the Android target (#2698) and stale androidApp
#     references (#2702) compiled clean here yet broke publish-apk.
#
# Runs on the srv4 self-hosted runner (label: srv4) so the host ~/.gradle and
# ~/android-sdk stay warm — cold ubuntu-latest was ~7m wall. Same trust model as
# publish-apk.yml: same-repo agent/operator PRs only (never fork PRs on this host).
# One gradle invocation keeps a single daemon; changelog-only diffs take the
# light lane (spotless+detekt) so patch-note PRs don't pay desktopTest.
name: kotlin-lint

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "client-android/**"
      - ".github/workflows/kotlin-lint.yml"

concurrency:
  group: kotlin-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: spotless + detekt + full desktopTest
    runs-on: [self-hosted, srv4]
    timeout-minutes: 20
    env:
      ANDROID_HOME: /home/choiceoh/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk-arm64
    defaults:
      run:
        working-directory: client-android/app
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 1

      - name: Ensure base commit
        if: github.event.pull_request.base.sha != ''
        uses: ./.github/actions/ensure-base-commit
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          fetch-ref: ${{ github.event.pull_request.base.ref }}

      - name: Detect heavy vs light native paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        working-directory: .
        run: |
          set -euo pipefail
          # Heavy: anything that can change compiled code or the gradle graph.
          # Light: changelog fragments / docs / this workflow alone.
          # workflow_dispatch (no PR base) always takes the heavy lane.
          if [ -z "${BASE_SHA:-}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "${BASE_SHA}" HEAD -- \
              'client-android/**/*.kt' \
              'client-android/**/*.kts' \
              'client-android/**/*.toml' \
              'client-android/**/gradle*' \
              'client-android/**/*.xml' \
              'client-android/**/*.pro' \
              'client-android/**/*.properties' \
              | grep -q .; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
          else
            echo "heavy=false" >> "$GITHUB_OUTPUT"
            echo "Light lane: no compiled native sources changed."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: spotless + detekt (light)
        if: steps.scope.outputs.heavy != 'true'
        run: ./gradlew spotlessCheck detekt

      - name: spotless + detekt + desktopTest + android compile
        if: steps.scope.outputs.heavy == 'true'
        run: >
          ./gradlew
          spotlessCheck
          detekt
          desktopTest
          :composeApp:compileAndroidMain
          :androidApp:compileFossReleaseKotlin
