# Bug-focused detekt profile. buildUponDefaultConfig=true, so this file only
# turns OFF the taste rulesets and tunes the bug catchers. Formatting is
# spotless's job; complexity/naming/style opinions are deliberately not gated
# (same philosophy as gateway-go/.golangci.yml).

complexity:
  active: false

naming:
  active: false

style:
  # detekt disables the whole ruleset when inactive, so `style` must be on for
  # the one rule we actually want: UnusedImports. Every other style rule is
  # explicitly OFF below — taste rules stay ungated (this file's philosophy);
  # only dead-code hygiene (unused imports) is enforced. Rationale: ktlint
  # dropped its no-unused-imports rule and spotless doesn't catch them, so
  # detekt is the only gate (97 unused imports had accumulated, incl. #3378's).
  active: true
  UnusedImports: { active: true, autoCorrect: true }
  MagicNumber: { active: false }
  MaxLineLength: { active: false }
  ReturnCount: { active: false }
  LoopWithTooManyJumpStatements: { active: false }
  UseCheckOrError: { active: false }
  UnusedParameter: { active: false }
  UnusedPrivateProperty: { active: false }
  UnusedPrivateMember: { active: false }
  ThrowsCount: { active: false }
  ForbiddenComment: { active: false }
  MayBeConst: { active: false }

comments:
  active: false

# Bug catchers stay on (potential-bugs, coroutines, exceptions are active in
# the default config). Tune the few that misfire on idiomatic KMP/Compose:
exceptions:
  TooGenericExceptionCaught:
    # catch (e: Exception) at IO/parse boundaries is the house pattern for
    # graceful degradation (stores, parsers); generic catches are reviewed
    # case-by-case, not gated.
    active: false
  SwallowedException:
    active: false
  InstanceOfCheckForException:
    # Misfires on the canonical coroutine-safe pattern
    # `catch (e: Exception) { if (e is CancellationException) throw e }` —
    # Kotlin has no multi-catch, so the suggested rewrite doesn't exist.
    active: false

potential-bugs:
  LateinitUsage:
    active: false

empty-blocks:
  EmptyFunctionBlock:
    # No-op `actual` stubs are the standard KMP pattern for platforms where a
    # feature doesn't exist (DesktopScrollbar on touch targets, sandbox
    # controllers off-Android). Not a bug signal here.
    active: false
