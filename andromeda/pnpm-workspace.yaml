# This pnpm distribution gates package build scripts via a supply-chain policy and
# fails install until each is explicitly approved here.
# - esbuild: prebuilt platform binary (vite + vitest)
# - msw: postinstall is non-essential for our Node/test usage; the browser worker
#   is committed under public/ via `msw init`.
allowBuilds:
  esbuild: true
  msw: true
minimumReleaseAgeExclude:
  - "@typescript/typescript-aix-ppc64@7.0.2"
  - "@typescript/typescript-darwin-arm64@7.0.2"
  - "@typescript/typescript-darwin-x64@7.0.2"
  - "@typescript/typescript-freebsd-arm64@7.0.2"
  - "@typescript/typescript-freebsd-x64@7.0.2"
  - "@typescript/typescript-linux-arm64@7.0.2"
  - "@typescript/typescript-linux-arm@7.0.2"
  - "@typescript/typescript-linux-loong64@7.0.2"
  - "@typescript/typescript-linux-mips64el@7.0.2"
  - "@typescript/typescript-linux-ppc64@7.0.2"
  - "@typescript/typescript-linux-riscv64@7.0.2"
  - "@typescript/typescript-linux-s390x@7.0.2"
  - "@typescript/typescript-linux-x64@7.0.2"
  - "@typescript/typescript-netbsd-arm64@7.0.2"
  - "@typescript/typescript-netbsd-x64@7.0.2"
  - "@typescript/typescript-openbsd-arm64@7.0.2"
  - "@typescript/typescript-openbsd-x64@7.0.2"
  - "@typescript/typescript-sunos-x64@7.0.2"
  - "@typescript/typescript-win32-arm64@7.0.2"
  - "@typescript/typescript-win32-x64@7.0.2"
  - typescript@7.0.2
onlyBuiltDependencies:
  - esbuild
  - msw
# TypeScript 7.0 migration — coexistence. TS7 is the native (Go) compiler and its
# `tsc` bin powers typecheck + build (see package.json: `typescript7` alias →
# typescript@7, which owns the `tsc` bin). But typescript-eslint@8 loads the TS
# *JS API* at parse time and crashes on TS7's reshaped internals (reading 'Cjs'),
# and it hard-requires a package literally named `typescript` (a peer — pnpm can't
# redirect it). So the `typescript` package is aliased to Microsoft's
# `@typescript/typescript6` compat build (owns the `tsc6` bin, not `tsc`), which the
# linter + editor load. Net: `tsc` = TS7 (native), `require("typescript")` = TS6 API.
# Revisit once typescript-eslint ships TS7 support — then drop the alias.
# CI installs deps explicitly, so skip pnpm's per-run deps re-verification.
verifyDepsBeforeRun: false
